# Host nginx site for the TESTING stand (72.56.34.157, /etc/nginx/sites-available/motio-test).
# The server is shared with another project whose nginx owns 80/443, so TLS for
# test.motio.nikog.net ends here and everything goes to motio-caddy on loopback;
# routing stays in infra/caddy/Caddyfile.testing. Installed by hand, not by
# deploy-testing.sh — see docs/operations.md.

map $http_upgrade $motio_test_connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name test.motio.nikog.net;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name test.motio.nikog.net;

  ssl_certificate /etc/letsencrypt/live/test.motio.nikog.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/test.motio.nikog.net/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # Backup restore uploads go up to BACKUP_MAX_UPLOAD_MB (1024 by default).
  client_max_body_size 1100m;
  # oauth2-proxy and Keycloak session cookies outgrow the 8k default header line.
  large_client_header_buffers 4 32k;

  location / {
    proxy_pass http://127.0.0.1:8088;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    # Realtime websockets.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $motio_test_connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_request_buffering off;
  }
}
