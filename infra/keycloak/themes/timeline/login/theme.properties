parent=keycloak
styles=css/styles.v11.css
scripts=js/login.v6.js
locales=en,ru,de
# Light and dark favicons in the page head (Keycloak 26.8+ renders these from the
# base template, so the theme needs no template.ftl of its own). Older Keycloak
# ignores them and shows img/favicon.ico until login.v6.js swaps the icon.
favicons.light=img/favicon-theme-light.png
favicons.light.media=(prefers-color-scheme: light)
favicons.dark=img/favicon-theme-dark.png
favicons.dark.media=(prefers-color-scheme: dark)
