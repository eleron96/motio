# NOTE: the duration below is hardcoded to match the INVITE_TTL_DAYS env var
# (default 14 days). If that env var is changed, update both the en and ru
# templates to match — Keycloak's {1} formatter renders raw minutes here, so
# we cannot safely substitute the duration dynamically.
executeActionsSubject=Motio invitation
executeActionsBody=You were invited to Motio. Open this secure link to continue: {0}. This link expires in 14 days.
executeActionsBodyHtml=<p>You were invited to <strong>Motio</strong>.</p><p>Use the secure link below to continue:</p><p><a href="{0}">Open invitation</a></p><p>This link expires in 14 days.</p>
