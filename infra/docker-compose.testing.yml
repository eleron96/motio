# Testing environment overrides.
# Applied on top of docker-compose.prod.yml to cap resources on the test
# server, which is shared with another project (ids-checker).
#
# Keycloak is shared too: realm `timeline` lives in ids-checker's Keycloak
# (container ids-checker-keycloak, served under /auth, network
# ids-checker_default). Our own keycloak/keycloak-db stay defined but only
# start with the `own-keycloak` profile; services that talk to Keycloak join
# the shared network instead.
#
# Usage: docker compose -f docker-compose.prod.yml -f docker-compose.testing.yml ...

services:
  db:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.9'

  keycloak-db:
    profiles: [own-keycloak]
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  keycloak:
    profiles: [own-keycloak]
    # 127.0.0.1:8081 is the shared Keycloak's; keep ours off it if ever started.
    ports: !override
      - "127.0.0.1:8082:8080"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.9'

  auth:
    depends_on: !override
      db:
        condition: service_healthy
    networks: [default, shared-keycloak]
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  rest:
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  realtime:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  functions:
    networks: [default, shared-keycloak]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  backup:
    environment:
      # The shared Keycloak DB belongs to ids-checker; we do not dump it.
      KEYCLOAK_DB_URL: ""
      # The test stand has no cloud bucket: S3 copies go to backup-s3 below.
      S3_ENDPOINT: http://backup-s3:9000
    depends_on:
      backup-s3:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # Stand-in for the production S3 bucket, so nightly backups, encryption and
  # restore-from-S3 drills run on the test stand too. Buckets are directories;
  # credentials come from S3_BUCKET / S3_ACCESS_KEY / S3_SECRET_KEY in the
  # test server's .env (via RCLONE_AUTH_KEY, not argv). Internal network only.
  backup-s3:
    image: rclone/rclone:1.68.2
    restart: unless-stopped
    entrypoint: ["sh", "-c", "mkdir -p \"/data/$$S3_BUCKET\" && exec rclone serve s3 --addr :9000 /data"]
    environment:
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET must be set in the test .env}
      # = --auth-key; rclone reads list flags from env as CSV, hence the inner quotes.
      RCLONE_AUTH_KEY: '"${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set in the test .env},${S3_SECRET_KEY:?S3_SECRET_KEY must be set in the test .env}"'
    volumes:
      - backup_s3_data:/data
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  storage:
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  gateway:
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

  web:
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

  oauth2-proxy:
    depends_on: !override
      web:
        condition: service_started
    networks: [default, shared-keycloak]

volumes:
  backup_s3_data:
    name: motio_test_backup_s3

networks:
  shared-keycloak:
    name: ids-checker_default
    external: true
