name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: i18n catalogs up to date
        run: |
          npm run lingui:extract
          git diff --exit-code src/locales \
            || (echo "::error::Locale catalogs are stale. Run 'npm run lingui:extract && npm run lingui:compile' and commit src/locales." && exit 1)

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
