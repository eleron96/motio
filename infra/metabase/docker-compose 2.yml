services:
  metabase-db:
    image: postgres:15-alpine
    container_name: metabase-db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_APP_DB_PASSWORD}
    volumes:
      - metabase_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - metabase-internal

  metabase:
    image: metabase/metabase:v0.50.27
    container_name: metabase
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    depends_on:
      metabase-db:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_APP_DB_PASSWORD}
      MB_DB_HOST: metabase-db
      MB_SITE_URL: https://analytics.motio.nikog.net
      MB_JETTY_HOST: 0.0.0.0
      MB_JETTY_PORT: 3000
      JAVA_OPTS: "-Xmx768m -XX:+UseG1GC"
    volumes:
      - metabase_plugins:/plugins
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - metabase-internal
      - motio-metabase
      - infra_default

networks:
  metabase-internal:
    name: metabase-internal
  motio-metabase:
    name: motio-metabase
    external: true
  infra_default:
    name: infra_default
    external: true

volumes:
  metabase_db:
    name: metabase_db
  metabase_plugins:
    name: metabase_plugins
