worker_processes auto;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  client_header_buffer_size 16k;
  large_client_header_buffers 8 64k;

  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  gzip on;
  gzip_types application/json application/javascript text/css text/plain;
  gzip_min_length 1024;

  # Lighter rate limits than prod — demo is public and not load-tested.
  limit_req_zone $binary_remote_addr zone=demo_auth:10m rate=5r/s;
  limit_req_zone $binary_remote_addr zone=demo_api:10m rate=200r/s;

  upstream demo_auth_upstream {
    server demo-auth:9999;
    keepalive 8;
  }

  upstream demo_rest_upstream {
    server demo-rest:3000;
    keepalive 8;
  }

  server {
    listen 8080;
    client_max_body_size 5m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
      default_type text/plain;
      add_header Cache-Control "no-store";
      return 200 "ok\n";
    }

    location /auth/v1/ {
      limit_req zone=demo_auth burst=10 nodelay;

      proxy_buffer_size 64k;
      proxy_buffers 8 64k;
      proxy_busy_buffers_size 128k;

      proxy_pass http://demo_auth_upstream/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rest/v1/ {
      limit_req zone=demo_api burst=50 nodelay;

      proxy_buffer_size 64k;
      proxy_buffers 8 64k;
      proxy_busy_buffers_size 128k;

      proxy_pass http://demo_rest_upstream/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      default_type text/plain;
      add_header Cache-Control "no-store";
      return 200 "Demo Supabase gateway. Routes: /auth/v1, /rest/v1.\n";
    }
  }
}
