# Testing environment overrides.
# Applied on top of docker-compose.prod.yml to cap resources on the test
# server, which is shared with another project.
#
# Usage: docker compose -f docker-compose.prod.yml -f docker-compose.testing.yml ...

services:
  db:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.9'

  keycloak-db:
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  keycloak:
    # The neighbouring project already publishes its Keycloak on
    # 127.0.0.1:8081, so ours moves to 8082 (test-compose.sh points the
    # keycloak-ensure-* scripts there).
    ports: !override
      - "127.0.0.1:8082:8080"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.9'

  auth:
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  rest:
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  realtime:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  functions:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  backup:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  storage:
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  gateway:
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

  web:
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
