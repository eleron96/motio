<!doctype html>
<html lang="en" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="icon"
      type="image/png"
      href="/favicon-theme-light.png"
      media="(prefers-color-scheme: light)"
      data-theme-favicon="light"
    />
    <link
      rel="icon"
      type="image/png"
      href="/favicon-theme-dark.png"
      media="(prefers-color-scheme: dark)"
      data-theme-favicon="dark"
    />
    <link rel="icon" type="image/png" href="/favicon-theme-light.png" data-theme-favicon="active" />
    <link rel="shortcut icon" href="/favicon-theme-light.png" data-theme-favicon="shortcut" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- PWA: installable app; on iOS 16.4+ an installed (Home Screen) app is
         what unlocks Web Push, so keep the manifest + apple metas in sync. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Motio" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14181f" media="(prefers-color-scheme: dark)" />
    <title>Motio — One timeline for your whole team. 10 seconds per task.</title>
    <meta name="description" content="Self-hosted team planner built around one screen — a shared timeline. No custom fields, no automations, no clutter. Built from real project pain, not startup theory." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://motio.nikog.net/" />

    <meta property="og:title" content="Motio — One timeline for your whole team. 10 seconds per task." />
    <meta property="og:description" content="Self-hosted team planner built around one screen — a shared timeline. No custom fields, no automations, no clutter. Built from real project pain, not startup theory." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://motio.nikog.net/" />
    <meta property="og:image" content="https://motio.nikog.net/logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Motio — One timeline for your whole team" />
    <meta name="twitter:description" content="Self-hosted team planner built around one shared timeline. Any task in 10 seconds. No clutter, no SaaS lock-in." />
    <meta name="twitter:image" content="https://motio.nikog.net/logo.png" />

    <script defer data-domain="motio.nikog.net" src="https://analise.nikog.webtm.ru/js/script.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
