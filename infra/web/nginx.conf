server {
  listen 80;
  server_name _;

  gzip on;
  gzip_types text/html text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_comp_level 5;
  # .gz files are made at build time (infra/web/precompress.mjs).
  gzip_static on;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  # The service worker must never be served with a long-lived cache header:
  # browsers bypass the HTTP cache for SW update checks anyway, but debug
  # fetches and older UAs should always see the current version too.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  location ~* \.map$ {
    return 404;
  }

  # Brotli files made at build time (infra/web/precompress.mjs), served as is.
  # Stock nginx has no brotli module, so the encoding and the type are set by
  # hand. These come before the /assets/ block: regex locations match in order.
  location ~ ^/assets/.+\.js\.br$ {
    types { }
    default_type application/javascript;
    gzip off;
    add_header Content-Encoding br;
    add_header Vary Accept-Encoding;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~ ^/assets/.+\.css\.br$ {
    types { }
    default_type text/css;
    gzip off;
    add_header Content-Encoding br;
    add_header Vary Accept-Encoding;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # /assets/: pick the brotli file for browsers that accept it, otherwise hand
  # the request to the internal location below. Only rewrites happen here:
  # an `if` inside a location turns off its try_files, so the file lookup lives
  # in a location without one.
  location ~ ^/assets/(?<asset>.+)$ {
    set $brotli "";
    if ($http_accept_encoding ~* "\bbr\b") {
      set $brotli "A";
    }
    if (-f $request_filename.br) {
      set $brotli "${brotli}B";
    }
    if ($brotli = "AB") {
      rewrite ^(.*)$ $1.br last;
    }
    rewrite ^ /__assets/$asset last;
  }

  # Files of earlier releases (bind mount, filled by prod-compose.sh /
  # test-compose.sh / install.sh): a tab opened before a release still loads
  # its lazy chunks instead of a 404 and a forced reload.
  location ~ ^/__assets/(?<asset_file>.+)$ {
    internal;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary Accept-Encoding;
    try_files /assets/$asset_file /assets-archive/$asset_file =404;
  }

  location ^~ /assets-archive/ {
    return 404;
  }

  location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
