name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: SQL security lint (SECURITY DEFINER revoke guard)
        run: bash infra/scripts/lint-security-definer.sh

      - name: Typecheck
        run: npm run typecheck

      - name: i18n catalogs up to date
        run: |
          npm run lingui:extract
          git diff --exit-code src/locales \
            || (echo "::error::Locale catalogs are stale. Run 'npm run lingui:extract && npm run lingui:compile' and commit src/locales." && exit 1)

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

  integration-tests:
    runs-on: ubuntu-latest
    # Bring up the same Supabase Postgres image and Liquibase migrations the dev
    # stack uses, then run the DB integration suite (RLS, account-deletion/purge
    # RPCs, cron) against it — the security-critical data layer now has a gate.
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: ci-super-secret-jwt-token-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Provision Supabase test database
        run: bash infra/scripts/ci-test-db.sh

      - name: Integration tests
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: "54322"
          TEST_DB_NAME: postgres
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres
        run: npm run test:integration

      - name: Postgres / migration logs (on failure)
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs db migrate
